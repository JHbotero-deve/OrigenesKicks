name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origenes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d origenes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js 16 dependencies
        run: |
          npm install next@16.3.3 react@19.2.0 react-dom@19.2.0 eslint-config-next@16.3.3 @types/react@19 @types/react-dom@19
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js to 16.3.3" || exit 0
          git push origin HEAD:review/senior-integral

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/origenes
        run: npx prisma db push

      - name: Build project
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/origenes
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NODE_ENV: production
        run: npm run build
