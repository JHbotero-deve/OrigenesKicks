name: Upgrade Next.js 16

on:
  push:
    branches:
      - review/senior-integral

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'chore: prepare Next.js 16 upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: review/senior-integral

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js and React
        run: |
          npm install next@16.3.3 react@19.2.0 react-dom@19.2.0 eslint-config-next@16.3.3 @types/react@19 @types/react-dom@19

      - name: Commit dependency upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js to 16.3.3" || exit 0
          git push origin review/senior-integral
