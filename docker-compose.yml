version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: origenes_db
    restart: always
    environment:
      POSTGRES_USER: user_origenes
      POSTGRES_PASSWORD: password_origenes
      POSTGRES_DB: origenes_kicks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
